<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function handleReset(event) {
            event.preventDefault(); // Prevent form submission
            alert("Password reset link has been sent to your email."); // Simulate sending a reset link
            window.location.href = "login.html"; // Redirect to the login page
        }
        function handleLogin(event) {
            event.preventDefault(); // Prevent form submission
            window.location.href = "login.html"; // Redirect to the login page
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white rounded-lg shadow-lg flex overflow-hidden max-w-4xl w-full">
        <div class="w-1/2 p-8">
            <div class="flex flex-col items-center">
                <img alt="E-Sahakara Logo" class="mb-4" src="logo.png" width="100" height="100"/>
                <h1 class="text-orange-500 text-2xl font-bold">FORGOT YOUR</h1>
                <h2 class="text-black text-3xl font-bold">PASSWORD?</h2>
                <p class="text-orange-500 text-sm">No worries! We'll help you reset it.</p>
            </div>
            <p class="mt-6 text-gray-700">Please enter your email address to receive a password reset link.</p>
            <form class="mt-4" action="forgot_password.php" method="POST">
                <div class="mb-4">
                    <label class="block text-gray-700">Email Address</label>
                    <input class="w-full px-3 py-2 border border-gray-300 rounded" type="email" name="email" required />
                </div>
                <div class="flex space-x-4">
                    <button class="bg-orange-500 text-white px-4 py-2 rounded" onclick="handleReset(event)">
                        Send Reset Link
                    </button>
                    <button class="border border-orange-500 text-orange-500 px-4 py-2 rounded" onclick="handleLogin(event)">
                        Back to Login
                    </button>
                </div>
            </form>
            <div class="mt-6 text-center">
                <p class="text-gray-700">Or go back to</p>
                <div class="flex justify-center space-x-4 mt-2">
                    <a class="text-blue-600" href="https://www.facebook.com/login/">
                        <i class="fab fa-facebook"></i> Facebook
                    </a>
                    <a class="text-blue-500" href="https://www.linkedin.com/login/">
                        <i class="fab fa-linkedin"></i> LinkedIn
                    </a>
                    <a class="text-red-500" href="https://www.google.com/login/">
                        <i class="fab fa-google"></i> Google
                    </a>
                </div>
            </div>
        </div>
        <div class="w-1/2 bg-orange-500 flex items-center justify-center relative">
            <img alt="Building with columns" class="absolute inset-0 w-full h-full object-cover opacity-50" src="building.jpg" width="400" height="400"/>
            <div class="relative z-10 text-center">
                <img alt="E-Sahakara Logo" class="mb-4 mx-auto" src="logo.png" width="100" height="100"/>
                <h1 class="text-black text-2xl font-bold">ESAHKARA</h1>
            </div>
        </div>
    </div>
</body>
</html>
